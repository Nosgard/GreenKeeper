name: Release

# Tags follow the schema "v1.0.0".
on:
  push:
    tags:
      - 'v*'

# Creating a GitHub release needs write access to the repository contents.
permissions:
  contents: write


jobs:
  build-and-release:
    # Both projects target net9.0-windows, so they build only on Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # The tests run again: a tag can point at any commit, including one whose tests never ran.
      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish application
        run: dotnet publish GreenKeeper/GreenKeeper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=none -o publish

      # Zips the whole publish folder (exe and native DLLs) into the file users download.
      - name: Create ZIP archive
        run: Compress-Archive -Path publish\* -DestinationPath GreenKeeper-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: GreenKeeper-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true